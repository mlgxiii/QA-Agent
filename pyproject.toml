[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-discovery-agent"
version = "0.1.0"
description = "AI agent that discovers popular open-source GitHub frameworks for SaaS packaging on Whop"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "gradio>=4.0.0",
]

[project.scripts]
saas-discovery = "saas_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["saas_agent*"]

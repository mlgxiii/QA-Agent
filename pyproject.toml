[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent"
version = "0.2.0"
description = "Production Scalability QA Agent + Website Design Analyzer powered by Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.52.0",
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
]

[project.scripts]
qa-agent = "qa_agent.cli:main"
design-analyzer = "design_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qa_agent*", "design_agent*"]

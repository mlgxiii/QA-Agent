[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent"
version = "0.1.0"
description = "Production Scalability QA Agent powered by Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.52.0",
]

[project.scripts]
qa-agent = "qa_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qa_agent*"]
